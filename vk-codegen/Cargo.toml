[package]
name = "vk-codegen"
version = "0.1.0"
edition = "2024"
description = "Vulkan Rust FFI generator from vk.xml + video.xml"

[[bin]]
name = "vk-codegen"
path = "src/main.rs"

[[bin]]
name = "vk-loader-allocation-audit"
path = "../vk-loader/scripts/diagnostics/allocation-audit.rs"

[lib]
name = "vk_codegen"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
roxmltree  = "0.20"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote       = "1"
prettyplease = "0.2"
syn         = { version = "2", features = ["full", "visit"] }
indexmap    = ">=2.3"
