[package]
name = "vk-demo-image-edit"
version = "0.1.0"
edition = "2024"
description = "Vulkan compute image stitch demo"
build = "build.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
vk-alloc = { path = "../../vk-alloc" }

[dependencies.vk]
path = "../../vk"
package = "vk"
features = ["VK_COMPUTE_VERSION_1_4"]
